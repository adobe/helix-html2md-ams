name: Build-ams
on:
  push:
    branches:
      - main-ams
  pull_request:
    branches:
      - main-ams

env:
  CI_BUILD_NUM: ${{ github.run_id }}
  CI_BRANCH: ${{ github.ref_name }}

permissions:
  id-token: write
  contents: write  # semantic-release-dry verifies the write permissions
  issues: read # needed by semantic-release
  pull-requests: write # needed by semantic-release

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm install
      # AMS templatized code reads HLX_PROD_SERVER_HOST_PAGE/_LIVE and HELIX_BUCKET_SUFFIX
      # directly; test/setup-env.js falls back to a 'BAD_VAR_...' placeholder when unset,
      # which then mismatches the real templatized code's own '|| aem.page'-style fallback
      # and breaks nock mocks. Dummy values only -- real ones aren't needed for unit tests.
      - run: npm test
        env:
          HELIX_BUCKET_SUFFIX: test
          AWS_REGION: us-east-1
          HLX_PROD_SERVER_HOST_PAGE: aem.page
          HLX_PROD_SERVER_HOST_LIVE: aem.live
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
